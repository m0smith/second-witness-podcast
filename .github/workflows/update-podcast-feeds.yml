name: Update podcast feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate current feeds
        run: node scripts/generate-podcast.js
      - name: Publish generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast.xml liahona.xml
          if git diff --cached --quiet; then
            echo "Feeds are already current."
          else
            git commit -m "Update podcast feeds"
            git push
          fi
