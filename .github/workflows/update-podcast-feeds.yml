name: Update podcast feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

jobs:
  build-feed:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate remaining 2026 schedule
        run: |
          for d in 2026-09-28 2026-10-05 2026-10-12 2026-10-19 2026-10-26 2026-11-02 2026-11-09 2026-11-16 2026-11-23 2026-11-30 2026-12-07 2026-12-14 2026-12-21; do
            echo "Validating $d"
            node scripts/generate-podcast.js --date "$d" >/dev/null
          done

      - name: Generate current feeds
        run: node scripts/generate-podcast.js
      - name: Publish generated feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast.xml liahona.xml
          if git diff --cached --quiet; then
            echo "Feeds are already current."
          else
            git commit -m "Update podcast feeds"
            git push
          fi
